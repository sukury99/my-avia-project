services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jetbook
      POSTGRES_USER: jetbook
      POSTGRES_PASSWORD: jetbook
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jetbook -d jetbook"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "9000:8000"
    environment:
      POSTGRES_DB: jetbook
      POSTGRES_USER: jetbook
      POSTGRES_PASSWORD: jetbook
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DEBUG: "True"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5174:5173"
    environment:
      VITE_API_URL: 'http://31.129.106.22:8000/api'
    depends_on:
      - backend

volumes:
  postgres_data:
