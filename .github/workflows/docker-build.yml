name: Docker Build Pipeline

on:
  push:
    branches: [ "main" ]  # Пайплайн запускается при любом пуше в ветку main

jobs:
  build-and-push:
    runs-on: ubuntu-latest  # Запускаем сборку на чистой машине Ubuntu

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Копируем ваш код на сервер сборки

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io  # Официальный реестр образов GitHub
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # Пароль генерируется автоматически

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:latest
